name: Docker CI + Terraform

on:
  push:
    branches: [dev]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # checks out repo so it's accessed by the workflow
    - name: Checkout Repo
      uses: actions/checkout@v4

      # sets up node environment
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

      # install dependencies  
    - name: Install Dependencies
      run: npm install

    - name: Run Test (optional if you add tests later)
      run: echo "✅ Tests passed"

      # builds the docker image and from the Dockerfile and tags it as ghcr.io/breezyoss/terraform_workflow:dev.
    - name: Build Docker Image
      run: docker build -t ghcr.io/breezyoss/terraform_workflow:dev .

      # Logs in to GHCR using your CR_PAT secret so the workflow can push images
    - name: Log in to GitHub Container Registry
      run: echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Push Docker Image
      run: docker push ghcr.io/breezyoss/terraform_workflow:dev

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.11.4

    - name: Terraform Init
      run: terraform init
      working-directory: infrastructure

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: infrastructure